<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Splash TV</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Splash TV"><img src="logo.webp" alt="Splash TV" width="92" height="44" /></a>
    <nav class="sections">
      <a href="#schedule" data-en="Schedule">赛程</a>
      <a href="#highlights" data-en="Highlights">集锦</a>
      <a href="#news" id="nav-news" data-en="News" hidden>新闻</a>
    </nav>
    <div class="seg lang" id="lang" role="group" aria-label="语言 / Language">
      <button data-lang="zh" lang="zh-CN">中</button>
      <button data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <main id="app">
    <section id="schedule" class="block">
      <div class="grid-2">
        <div>
          <h2><span data-en="Schedule">赛程</span> <small id="sched-sub"></small></h2>
          <article class="card" id="schedule-card"><div class="loading" data-en="Loading…">加载中…</div></article>
        </div>
        <div>
          <h2><span data-en="Results">战绩</span> <small id="res-sub"></small></h2>
          <article class="card" id="results-card"><div class="loading" data-en="Loading…">加载中…</div></article>
        </div>
      </div>
    </section>

    <section id="highlights" class="block">
      <h2><span data-en="Highlights">集锦</span> <small id="hl-sub"></small></h2>
      <div id="hl-wrap"><div class="loading" data-en="Loading…">加载中…</div></div>
    </section>

    <section id="news" class="block" hidden>
      <h2><span data-en="News">新闻</span> <small id="news-sub"></small></h2>
      <div class="card" id="news-list"><div class="loading" data-en="Loading…">加载中…</div></div>
    </section>
  </main>

  <footer class="foot"><span data-en="Data: ESPN · official YouTube channels">数据来源：ESPN · YouTube 官方频道</span> · <span id="updated"></span></footer>
  <script src="app.js" type="module"></script>
</body>
</html>
