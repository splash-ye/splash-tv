name: Build & deploy

on:
  schedule:
    # Primary trigger: cron-job.org calls workflow_dispatch at :00/:15/:30/:45.
    # GitHub's own schedule is unreliable (often skipped), so it's only a fallback, kept off the hour.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # commit data/ snapshots back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site
        run: node src/build.js

      # Weekly marquee lists, the daily schedule and found highlights must survive between runs.
      - name: Persist data snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update data snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # deploy-pages looks the artifact up within ~1s of upload-pages-artifact finalising it, and
      # GitHub's artifact API occasionally hasn't caught up yet ("Found 0 artifact(s)"). Retry once.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for artifact to become visible
        if: steps.deploy.outcome == 'failure'
        run: sleep 20

      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
